# ─── DairyXpress Backend Configuration ───────────────────────────

# Server
server.port=8080

# MySQL Database
#spring.datasource.url=jdbc:mysql://localhost:3306/dairy_xpress?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=Vipul@2003
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Execute data.sql after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true

# Seed data — loads on first start (always executes, idempotent INSERT IGNORE)
spring.sql.init.mode=always

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=UTC

# JWT
app.jwt.secret=dairyXpressSuperSecretKey2026ForJwtSigningPleaseChangeInProduction9876543210
app.jwt.expiration-ms=86400000
app.jwt.header=Authorization
app.jwt.prefix=Bearer 

